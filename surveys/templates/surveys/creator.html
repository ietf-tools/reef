{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}
  <link rel="stylesheet" href="{% static 'vendor/surveyjs/survey-core.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/surveyjs/survey-creator-core.min.css' %}">
  <style>#surveyCreator { height: calc(100vh - 8rem); }</style>
{% endblock %}

{% block content_title %}{% endblock %}

{% block content %}
  <h1>{{ survey.title }} <small>({{ survey.slug }})</small></h1>
  {{ config|json_script:"reef-config" }}
  <div id="surveyCreator"></div>
{% endblock %}

{% block extrabody %}
  <script src="{% static 'vendor/surveyjs/survey.core.min.js' %}"></script>
  <script src="{% static 'vendor/surveyjs/survey-js-ui.min.js' %}"></script>
  <script src="{% static 'vendor/surveyjs/survey-creator-core.min.js' %}"></script>
  <script src="{% static 'vendor/surveyjs/survey-creator-js.min.js' %}"></script>
  <script src="{% static 'surveys/init-creator.js' %}"></script>
{% endblock %}
