{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pink{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #222; }
    header { background: #b5177e; color: #fff; padding: 0.75rem 1.25rem; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    main { padding: 1.25rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header><a href="{% url 'manage-survey-list' %}">Pink survey builder</a></header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
