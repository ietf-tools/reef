server {
  listen 8088 default_server;
  listen [::]:8088 default_server;

  proxy_read_timeout 1d;
  proxy_send_timeout 1d;
  client_max_body_size 0;  # disable size checking

  root /var/www/html;
  index index.html index.htm;

  server_name _;

  # pgAdmin
  location /pgadmin/ {
    proxy_set_header X-Script-Name /pgadmin;
    proxy_set_header Host $host;
    proxy_pass http://pgadmin;
    proxy_redirect off;
  }

  # Django: admin, OIDC, the survey builder/analytics site, static, debug toolbar
  location ~ ^/(admin|oidc|manage|static|__debug__)/ {
    error_page 502 /502.html;
    proxy_pass http://localhost:8001;
    proxy_set_header Host localhost:8088;
  }

  # Django: the Reef REST API and health check
  location /api/reef/ {
    error_page 502 /502.html;
    proxy_pass http://localhost:8001;
    proxy_set_header Host localhost:8088;
  }
  location /health/ {
    proxy_pass http://localhost:8001;
    proxy_set_header Host localhost:8088;
  }

  # Convenience login redirect into the OIDC flow
  location = /login {
    rewrite .* /oidc/authenticate/ redirect;
  }

  # Everything else (including /s/* survey runner) goes to the Nuxt dev server
  location / {
    error_page 502 /502.html;
    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:8088;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    etag off;
  }

  location /502.html {
    root /var/www/html;
    internal;
  }
}
