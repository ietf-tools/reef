server {
  listen 8088 default_server;
  listen [::]:8088 default_server;

  proxy_read_timeout 1d;
  proxy_send_timeout 1d;
  client_max_body_size 0;  # disable size checking

  # The same page the worker serves at / in a deployment; anything not routed
  # below is a 404, as it is there.
  root /workspace/worker/public;
  index index.html;

  server_name _;

  # pgAdmin
  location /pgadmin/ {
    proxy_set_header X-Script-Name /pgadmin;
    proxy_set_header Host $host;
    proxy_pass http://pgadmin;
    proxy_redirect off;
  }

  # Django: admin, OIDC, the survey builder/analytics site, static, debug toolbar
  location ~ ^/(admin|oidc|manage|static|__debug__)/ {
    error_page 502 /502.html;
    proxy_pass http://localhost:8001;
    proxy_set_header Host localhost:8088;
  }

  # Django: the Reef REST API and health check
  location /api/reef/ {
    error_page 502 /502.html;
    proxy_pass http://localhost:8001;
    proxy_set_header Host localhost:8088;
  }
  # Django: the precomputed files, rendered live, at the paths the worker
  # serves them from the bucket in a deployment
  location /api/v1/ {
    error_page 502 /502.html;
    proxy_pass http://localhost:8001;
    proxy_set_header Host localhost:8088;
  }
  location /health/ {
    proxy_pass http://localhost:8001;
    proxy_set_header Host localhost:8088;
  }

  # Convenience login redirect into the OIDC flow
  location = /login {
    rewrite .* /oidc/authenticate/ redirect;
  }

  # Red's dev server hosts the survey runner, as Red does in a deployment, where
  # the worker answers /s with a 301 (worker/src/runner.ts). Temporary here so
  # that a browser does not cache a redirect to localhost:3000 for good.
  location = /s {
    return 302 http://localhost:3000/survey/$is_args$args;
  }

  location /502.html {
    root /var/www/html;
    internal;
  }
}
