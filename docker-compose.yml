services:
  db:
    build:
      dockerfile: docker/db.Dockerfile
    volumes:
      - postgresdb-data:/var/lib/postgresql/data
      - .:/workspace
    restart: unless-stopped
    environment:
      - POSTGRES_DB=reef
      - POSTGRES_USER=reef
      - POSTGRES_PASSWORD=reef
      - POSTGRES_HOST_AUTH_METHOD=trust
      - DUMPFILE=

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: reef-app
    command: sleep infinity
    volumes:
      - .:/workspace
    environment:
      - REEF_DEPLOYMENT_MODE=development
      - POSTGRES_DB=reef
      - POSTGRES_USER=reef
      - POSTGRES_PASSWORD=reef
      - POSTGRES_HOST=db
      - REEF_BROKER_URL=amqp://mq/
      # OIDC (Authentik at account.ietf.org). Set these in a local .env file.
      # Reef as a relying party, logging its own staff into the builder site:
      - REEF_OIDC_APP_SLUG=${REEF_OIDC_APP_SLUG:-reef}
      - REEF_OIDC_RP_CLIENT_ID=${REEF_OIDC_RP_CLIENT_ID:-}
      - REEF_OIDC_RP_CLIENT_SECRET=${REEF_OIDC_RP_CLIENT_SECRET:-}
      - REEF_OIDC_STAFF_GROUPS=${REEF_OIDC_STAFF_GROUPS:-}
      - REEF_SURVEYJS_LICENSE_KEY=${REEF_SURVEYJS_LICENSE_KEY:-}
      # Reef as a resource server: whose API access tokens it accepts.
      - REEF_API_OIDC_APP_SLUGS=${REEF_API_OIDC_APP_SLUGS:-}
      - REEF_API_OIDC_AUDIENCES=${REEF_API_OIDC_AUDIENCES:-}
      - REEF_API_OIDC_ALGORITHMS=${REEF_API_OIDC_ALGORITHMS:-}
      # Public client id for the Nuxt runner's browser OIDC login.
      - NUXT_PUBLIC_OIDC_CLIENT_ID=${NUXT_PUBLIC_OIDC_CLIENT_ID:-}
    depends_on:
      - db
      - mq
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery:
    image: reef-app
    command: ["/celery-init.sh"]
    volumes:
      - .:/workspace
    restart: unless-stopped
    environment:
      - REEF_DEPLOYMENT_MODE=development
      - POSTGRES_DB=reef
      - POSTGRES_USER=reef
      - POSTGRES_PASSWORD=reef
      - POSTGRES_HOST=db
      - REEF_BROKER_URL=amqp://mq/
      - CELERY_APP=reef
    depends_on:
      - db
      - mq
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      - MP_DISABLE_VERSION_CHECK=true
      - MP_LABEL=ReefMail
    ports:
      - "1025:1025"
      - "8025:8025"

  mq:
    image: rabbitmq:4.1-management

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=dev@ietf.org
      - PGADMIN_DEFAULT_PASSWORD=dev
      - PGADMIN_CONFIG_LOGIN_BANNER="Login with dev@ietf.org / dev"
      - PGADMIN_DISABLE_POSTFIX=True
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - SCRIPT_NAME=/pgadmin
    volumes:
      - ./docker/configs/pgadmin-servers.json:/pgadmin4/servers.json

volumes:
  postgresdb-data:
