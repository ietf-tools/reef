services:
  db:
    build:
      dockerfile: docker/db.Dockerfile
    volumes:
      - postgresdb-data:/var/lib/postgresql/data
      - .:/workspace
    restart: unless-stopped
    environment:
      - POSTGRES_DB=reef
      - POSTGRES_USER=reef
      - POSTGRES_PASSWORD=reef
      - POSTGRES_HOST_AUTH_METHOD=trust
      - DUMPFILE=

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: reef-app
    command: sleep infinity
    volumes:
      - .:/workspace
    environment:
      - REEF_DEPLOYMENT_MODE=development
      - POSTGRES_DB=reef
      - POSTGRES_USER=reef
      - POSTGRES_PASSWORD=reef
      - POSTGRES_HOST=db
      - REEF_BROKER_URL=amqp://mq/
      # OIDC (Authentik at account.ietf.org). Set these in a local .env file.
      # Reef as a relying party, logging its own staff into the admin and
      # builder/analytics site under the "reef-admin-staging" application:
      - REEF_ADMIN_OIDC_APP_SLUG=${REEF_ADMIN_OIDC_APP_SLUG:-reef-admin-staging}
      - REEF_ADMIN_OIDC_RP_CLIENT_ID=${REEF_ADMIN_OIDC_RP_CLIENT_ID:-}
      - REEF_ADMIN_OIDC_RP_CLIENT_SECRET=${REEF_ADMIN_OIDC_RP_CLIENT_SECRET:-}
      - REEF_OIDC_STAFF_GROUPS=${REEF_OIDC_STAFF_GROUPS:-}
      - REEF_OIDC_SUPERUSER_GROUPS=${REEF_OIDC_SUPERUSER_GROUPS:-}
      - REEF_SURVEYJS_LICENSE_KEY=${REEF_SURVEYJS_LICENSE_KEY:-}
      # Reef as a resource server: whose API access tokens it accepts.
      - REEF_API_OIDC_APP_SLUGS=${REEF_API_OIDC_APP_SLUGS:-}
      - REEF_API_OIDC_AUDIENCES=${REEF_API_OIDC_AUDIENCES:-}
      - REEF_API_OIDC_ALGORITHMS=${REEF_API_OIDC_ALGORITHMS:-}
      # The Nuxt runner's browser OIDC login, against "reef-staging". Defaulted
      # here rather than left empty: Nuxt takes an empty variable as the value,
      # which would override nuxt.config.ts with nothing.
      - NUXT_PUBLIC_OIDC_AUTHORITY=${NUXT_PUBLIC_OIDC_AUTHORITY:-https://account.ietf.org/application/o/reef-staging/}
      - NUXT_PUBLIC_OIDC_CLIENT_ID=${NUXT_PUBLIC_OIDC_CLIENT_ID:-dAytIOu6rzN2Za3kyeFlo3FhHh3K0al0w0k1N649}
    depends_on:
      - db
      - mq
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery:
    image: reef-app
    command: ["/celery-init.sh"]
    volumes:
      - .:/workspace
    restart: unless-stopped
    environment:
      - REEF_DEPLOYMENT_MODE=development
      - POSTGRES_DB=reef
      - POSTGRES_USER=reef
      - POSTGRES_PASSWORD=reef
      - POSTGRES_HOST=db
      - REEF_BROKER_URL=amqp://mq/
      - CELERY_APP=reef
    depends_on:
      - db
      - mq
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      - MP_DISABLE_VERSION_CHECK=true
      - MP_LABEL=ReefMail
    ports:
      - "1025:1025"
      - "8025:8025"

  mq:
    image: rabbitmq:4.1-management

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=dev@ietf.org
      - PGADMIN_DEFAULT_PASSWORD=dev
      - PGADMIN_CONFIG_LOGIN_BANNER="Login with dev@ietf.org / dev"
      - PGADMIN_DISABLE_POSTFIX=True
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - SCRIPT_NAME=/pgadmin
    volumes:
      - ./docker/configs/pgadmin-servers.json:/pgadmin4/servers.json

volumes:
  postgresdb-data:
