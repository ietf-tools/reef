name: Make Release and Deploy
run-name: RELEASE ${{ github.run_number }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      deployStrategy:
        description: 'Deploy Strategy'
        default: 'Recreate'
        required: true
        type: choice
        options:
          - Recreate
          - RollingUpdate
          - Current

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------
  # PREPARE
  # -----------------------------------------------------------------
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      buildVersion: ${{ steps.buildvars.outputs.buildVersion }}
      previousVersion: ${{ steps.semver.outputs.current }}
      baseImageVersion: ${{ steps.buildvars.outputs.baseImageVersion }}
    steps:
      - uses: actions/checkout@v7

      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          skipInvalidTags: true
          patchAll: true

      - name: Create Draft Release
        uses: ncipollo/release-action@v1.21.0
        with:
          prerelease: true
          draft: false
          commit: ${{ github.sha }}
          tag: ${{ steps.semver.outputs.nextStrict }}
          name: ${{ steps.semver.outputs.nextStrict }}
          body: '*pending*'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Build Variables
        id: buildvars
        run: |
          echo "Will set build version to: ${{ steps.semver.outputs.nextStrict }}"
          echo "buildVersion=${{ steps.semver.outputs.nextStrict }}" >> $GITHUB_OUTPUT
          echo "::notice::Release ${{ steps.semver.outputs.nextStrict }} created using branch $GITHUB_REF_NAME"
          echo "baseImageVersion=$(sed -n '1p' dev/build/TARGET_BASE)" >> $GITHUB_OUTPUT

  # -----------------------------------------------------------------
  # BUILD RELEASE
  # -----------------------------------------------------------------
  build:
    name: Build Release Image
    uses: ./.github/workflows/reusable-build.yml
    if: ${{ !failure() && !cancelled() }}
    needs: [prepare]
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      buildVersion: ${{needs.prepare.outputs.buildVersion}}
      isReleaseBuild: true
      previousVersion: ${{needs.prepare.outputs.previousVersion}}
      baseImageVersion: ${{ needs.prepare.outputs.baseImageVersion }}

  # -----------------------------------------------------------------
  # NOTIFY
  # -----------------------------------------------------------------
  notify:
    name: Notify
    if: ${{ always() }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: ${{needs.prepare.outputs.buildVersion}}

    steps:
    - name: Notify on Slack (Success)
      if: ${{ !contains(join(needs.*.result, ','), 'failure') }}
      uses: slackapi/slack-github-action@v3
      with:
        token: ${{ secrets.SLACK_GH_BOT }}
        method: chat.postMessage
        payload: |
          channel: ${{ secrets.SLACK_GH_BUILDS_CHANNEL_ID }}
          text: "Reef Release Build <https://github.com/ietf-tools/reef/actions/runs/${{ github.run_id }}|${{ env.BUILD_VERSION }}> by ${{ github.triggering_actor }}"
          attachments:
            - color: "28a745"
              fields:
                - title: "Status"
                  short: true
                  value: "Completed"
    - name: Notify on Slack (Failure)
      if: ${{ contains(join(needs.*.result, ','), 'failure') }}
      uses: slackapi/slack-github-action@v3
      with:
        token: ${{ secrets.SLACK_GH_BOT }}
        method: chat.postMessage
        payload: |
          channel: ${{ secrets.SLACK_GH_BUILDS_CHANNEL_ID }}
          text: "Reef Release Build <https://github.com/ietf-tools/reef/actions/runs/${{ github.run_id }}|${{ env.BUILD_VERSION }}> by ${{ github.triggering_actor }}"
          attachments:
            - color: "a82929"
              fields:
                - title: "Status"
                  short: true
                  value: "Failed 😱"

  # -----------------------------------------------------------------
  # STAGING
  # -----------------------------------------------------------------
  staging:
    name: Deploy to Staging
    if: ${{ !failure() && !cancelled() }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      BUILD_VERSION: ${{needs.prepare.outputs.buildVersion}}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Build Staging Frontend
        env:
          NUXT_PUBLIC_OIDC_AUTHORITY: https://account.ietf.org/application/o/reef-staging/
          NUXT_PUBLIC_OIDC_CLIENT_ID: dAytIOu6rzN2Za3kyeFlo3FhHh3K0al0w0k1N649
          NUXT_PUBLIC_RFCEDITOR_BASE: https://www.staging.rfc-editor.org
          DEBIAN_FRONTEND: noninteractive
          BROWSERSLIST_IGNORE_OLD_DATA: 1
        run: |
          echo "Installing node packages for client..."
          (cd client && npm ci)
          echo "Generating SPA build..."
          (cd client && npm run generate)
          echo "Installing node packages for worker..."
          (cd worker && npm ci)

      - name: Refresh Staging DB
        uses: ietf-tools/workflow-dispatch-action@v1
        with:
          workflow: deploy-db.yml
          repo: ietf-tools/infra-k8s
          ref: main
          token: ${{ secrets.GH_INFRA_K8S_TOKEN }}
          inputs: '{ "environment":"${{ secrets.GHA_K8S_CLUSTER }}", "app":"reef", "manifest":"postgres", "forceRecreate":true, "restoreToLastFullSnapshot":true, "waitClusterReady":true }'
          waitForCompletionTimeout: 120m

      - name: Deploy to staging
        uses: ietf-tools/workflow-dispatch-action@v1
        with:
          workflow: deploy.yml
          repo: ietf-tools/infra-k8s
          ref: main
          token: ${{ secrets.GH_INFRA_K8S_TOKEN }}
          inputs: '{ "environment":"${{ secrets.GHA_K8S_CLUSTER }}", "app":"reef", "appVersion":"${{ env.BUILD_VERSION }}", "remoteRef":"${{ github.sha }}", "deployStrategy":"${{ inputs.deployStrategy }}" }'
          waitForCompletionTimeout: 30m

      - name: Deploy worker to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_WORKER_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CF_WORKER_DEPLOY_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env staging --name reef-frontend-staging
          environment: staging


  # -----------------------------------------------------------------
  # PROD
  # -----------------------------------------------------------------
  prod:
    name: Deploy to Production
    if: ${{ !failure() && !cancelled() }}
    needs: [prepare, staging]
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      BUILD_VERSION: ${{needs.prepare.outputs.buildVersion}}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Build Production Frontend
        env:
          NUXT_PUBLIC_OIDC_AUTHORITY: https://account.ietf.org/application/o/reef/
          NUXT_PUBLIC_OIDC_CLIENT_ID: pi8Impk53wJcnmN2AnN4xmwnUpITDRvReNh6CD4I
          NUXT_PUBLIC_RFCEDITOR_BASE: https://www.rfc-editor.org
          DEBIAN_FRONTEND: noninteractive
          BROWSERSLIST_IGNORE_OLD_DATA: 1
        run: |
          echo "Installing node packages for client..."
          (cd client && npm ci)
          echo "Generating SPA build..."
          (cd client && npm run generate)
          echo "Installing node packages for worker..."
          (cd worker && npm ci)

      - name: Deploy backend to production
        uses: ietf-tools/workflow-dispatch-action@v1
        with:
          workflow: deploy.yml
          repo: ietf-tools/infra-k8s
          ref: main
          token: ${{ secrets.GH_INFRA_K8S_TOKEN }}
          inputs: '{ "environment":"${{ secrets.GHA_K8S_CLUSTER }}", "app":"reef", "appVersion":"${{ env.BUILD_VERSION }}", "remoteRef":"${{ github.sha }}", "deployStrategy":"${{ inputs.deployStrategy }}" }'
          waitForCompletionTimeout: 30m

      - name: Deploy worker to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_WORKER_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CF_WORKER_DEPLOY_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env production --name reef-frontend
          environment: production
