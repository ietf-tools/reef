name: build-base-app

# Builds and publishes the base image the app/backend images build FROM.
on:
  push:
    branches: [prototype, main]
    paths:
      - docker/base.Dockerfile
      - .github/workflows/build-base-app.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base.Dockerfile
          push: true
          tags: ghcr.io/ietf-tools/pink-app-base:latest
