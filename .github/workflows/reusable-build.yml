name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      buildVersion:
        required: true
        type: string
      isReleaseBuild:
        default: false
        required: false
        type: boolean
      previousVersion:
        required: false
        type: string
      baseImageVersion:
        default: latest
        required: false
        type: string
      skipArmBuild:
        default: false
        required: false
        type: boolean

jobs:
  # -----------------------------------------------------------------
  # BUILD IMAGE
  # -----------------------------------------------------------------
  build:
    name: Build Image
    runs-on:
      group: hperf-8c32r
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
        fetch-tags: false

    - name: Setup Node.js environment
      uses: actions/setup-node@v7
      with:
        node-version: 26.x

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Setup AWS CLI
      uses: unfor19/install-aws-cli-action@v1
      with:
        version: 2.22.35

    - name: Build Frontend
      env:
        DEBIAN_FRONTEND: noninteractive
        BROWSERSLIST_IGNORE_OLD_DATA: 1
      working-directory: client
      run: |
        echo "Installing node packages..."
        npm ci
        echo "Generating SPA build..."
        npm run generate
        echo "Packaging build..."
        mkdir -p package/dist
        cp -r .output/public/. package/dist/
        cp worker.js package/worker.js
        cp wrangler.jsonc package/wrangler.jsonc

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: frontend
        path: client/package/
        if-no-files-found: error

    - name: Augment dockerignore for docker image build
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        cat >> .dockerignore <<EOL
        .devcontainer
        .github
        .vscode
        k8s
        docker-compose.yml
        EOL

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Add feature-latest tag
      if: ${{ startsWith(github.ref_name, 'feat/') }}
      run: echo "FEATURE_LATEST_TAG=$(echo $GITHUB_REF_NAME | tr / -)" >> $GITHUB_ENV

    - name: Build Images
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build/backend.Dockerfile
        platforms: ${{ inputs.skipArmBuild && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
        push: true
        tags: |
          ghcr.io/ietf-tools/reef-backend:${{ inputs.buildVersion }}
          ${{ env.FEATURE_LATEST_TAG && format('ghcr.io/ietf-tools/reef-backend:{0}-latest', env.FEATURE_LATEST_TAG) || null }}

    - name: Generate CHANGELOG
      id: changelog
      uses: requarks/changelog-action@v1
      if: ${{ inputs.isReleaseBuild }}
      with:
        token: ${{ github.token }}
        fromTag: ${{ inputs.buildVersion }}
        toTag: ${{ inputs.previousVersion }}
        writeToFile: false

    - name: Create Release
      uses: ncipollo/release-action@v1.21.0
      if: ${{ inputs.isReleaseBuild }}
      with:
        allowUpdates: true
        makeLatest: true
        draft: false
        tag: ${{ inputs.buildVersion }}
        name: ${{ inputs.buildVersion }}
        body: ${{ steps.changelog.outputs.changes }}
        artifacts: "/home/runner/work/release/release.tar.gz"
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ inputs.buildVersion }}
        path: /home/runner/work/release/release.tar.gz
