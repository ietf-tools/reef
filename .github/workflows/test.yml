name: tests

on:
  push:
    branches: [prototype, main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pink
          POSTGRES_USER: pink
          POSTGRES_PASSWORD: pink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pink"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PINK_DEPLOYMENT_MODE: development
      POSTGRES_HOST: localhost
      POSTGRES_DB: pink
      POSTGRES_USER: pink
      POSTGRES_PASSWORD: pink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --disable-pip-version-check -r requirements.txt ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py migrate
      - run: python manage.py test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
