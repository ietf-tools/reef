name: tests

on:
  push:
    branches: [prototype, main]
  pull_request:
  workflow_dispatch:
  # Two things change without a commit to react to: advisories are published against
  # versions already shipped, and the >= bounds in requirements.txt let a new upstream
  # release into the next build. Off the hour, which GitHub asks for.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  lint-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install --disable-pip-version-check ruff
      - name: Check code format
        run: ruff format --check --diff .
      - name: Check code style and linting
        run: ruff check .

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: reef
          POSTGRES_USER: reef
          POSTGRES_PASSWORD: reef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reef"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REEF_DEPLOYMENT_MODE: development
      REEF_BROKER_URL: memory://
      POSTGRES_HOST: localhost
      POSTGRES_DB: reef
      POSTGRES_USER: reef
      POSTGRES_PASSWORD: reef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install --disable-pip-version-check -r requirements.txt
      - run: python manage.py migrate
      - run: python manage.py test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Audit installed packages
        # Auditing requirements.txt directly would audit its lower bounds, which many
        # releases satisfy; what matters is the versions this build installed. pip-audit
        # runs from its own environment so its own dependencies are not part of what is
        # being audited.
        run: |
          pip freeze > /tmp/installed.txt
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --disable-pip-version-check pip-audit
          /tmp/audit/bin/pip-audit --strict --no-deps -r /tmp/installed.txt

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
