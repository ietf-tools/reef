apiVersion: v1
kind: ConfigMap
metadata:
  name: reef-config
data:
  REEF_DEPLOYMENT_MODE: "production"
  # Host-specific values are overridden per environment in the overlays.
  REEF_ALLOWED_HOSTS: "reef.example.org"
  REEF_DB_HOST: "postgres"
  REEF_DB_PORT: "5432"
  REEF_DB_NAME: "reef"
  REEF_DB_USER: "reef"
  REEF_BROKER_URL: "amqp://mq:5672//"
  REEF_OIDC_APP_SLUG: "reef"
  REEF_OIDC_RP_CLIENT_ID: ""
  REEF_OIDC_STAFF_GROUPS: ""
  # Frontend (Nuxt) configuration.
  NUXT_API_BASE_SERVER: "http://reef-backend:8000"
  NUXT_PUBLIC_API_BASE: ""
  NUXT_PUBLIC_OIDC_AUTHORITY: "https://account.ietf.org/application/o/reef/"
  NUXT_PUBLIC_OIDC_CLIENT_ID: ""
