apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - secret.yaml
  - backend.yaml
  - celery.yaml
  - beat.yaml
  - frontend.yaml
  - statics.yaml
  - memcached.yaml
  - mq.yaml
  - ingress.yaml

images:
  - name: ghcr.io/ietf-tools/reef-backend
    newTag: latest
  - name: ghcr.io/ietf-tools/reef-frontend
    newTag: latest
  - name: ghcr.io/ietf-tools/reef-statics
    newTag: latest
