apiVersion: apps/v1
kind: Deployment
metadata:
  name: reef-frontend
  labels:
    app.kubernetes.io/part-of: reef
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: reef
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ietf-tools/reef-frontend:latest
          envFrom:
            - configMapRef:
                name: reef-config
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: reef-frontend
  labels:
    app.kubernetes.io/part-of: reef
spec:
  selector:
    app.kubernetes.io/component: frontend
  ports:
    - port: 3000
      targetPort: 3000
