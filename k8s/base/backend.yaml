apiVersion: apps/v1
kind: Deployment
metadata:
  name: reef-backend
  labels:
    app.kubernetes.io/part-of: reef
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: reef
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        # Apply migrations before the API starts (runs on every rollout).
        - name: migrate
          image: ghcr.io/ietf-tools/reef-backend:latest
          command: ["./start.sh"]
          env:
            - name: CONTAINER_ROLE
              value: migrations
          envFrom:
            - configMapRef:
                name: reef-config
            - secretRef:
                name: reef-secrets
      containers:
        - name: backend
          image: ghcr.io/ietf-tools/reef-backend:latest
          env:
            - name: CONTAINER_ROLE
              value: backend
          envFrom:
            - configMapRef:
                name: reef-config
            - secretRef:
                name: reef-secrets
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: reef-backend
  labels:
    app.kubernetes.io/part-of: reef
spec:
  selector:
    app.kubernetes.io/component: backend
  ports:
    - port: 8000
      targetPort: 8000
