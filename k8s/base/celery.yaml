apiVersion: apps/v1
kind: Deployment
metadata:
  name: reef-celery
  labels:
    app.kubernetes.io/part-of: reef
    app.kubernetes.io/component: celery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: celery
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: reef
        app.kubernetes.io/component: celery
    spec:
      containers:
        - name: celery
          image: ghcr.io/ietf-tools/reef-backend:latest
          env:
            - name: CONTAINER_ROLE
              value: celery
            - name: CELERY_APP
              value: reef
          envFrom:
            - configMapRef:
                name: reef-config
            - secretRef:
                name: reef-secrets
