apiVersion: apps/v1
kind: Deployment
metadata:
  name: reef-backend
  labels:
    app.kubernetes.io/part-of: reef
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: reef
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        # Apply migrations before the API starts (runs on every rollout).
        - name: migrate
          image: ghcr.io/ietf-tools/reef-backend:$APP_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["./start.sh"]
          env:
            - name: CONTAINER_ROLE
              value: migrations
          envFrom:
            - secretRef:
                name: reef-secrets-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 1000
      containers:
        - name: backend
          image: ghcr.io/ietf-tools/reef-backend:$APP_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          env:
            - name: CONTAINER_ROLE
              value: backend
          envFrom:
            - secretRef:
                name: reef-secrets-env
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: reef-backend
  labels:
    app.kubernetes.io/part-of: reef
spec:
  selector:
    app.kubernetes.io/component: backend
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
