apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pink-staging

resources:
  - ../../base

patches:
  - path: configmap-patch.yaml
  # Replace only the Ingress host (a strategic merge would drop the path rules).
  - target:
      kind: Ingress
      name: pink
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: pink.staging.ietf.org

images:
  - name: ghcr.io/ietf-tools/pink-backend
    newTag: staging
  - name: ghcr.io/ietf-tools/pink-frontend
    newTag: staging
  - name: ghcr.io/ietf-tools/pink-statics
    newTag: staging
