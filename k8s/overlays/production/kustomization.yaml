apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: reef

resources:
  - ../../base

patches:
  - path: configmap-patch.yaml
  # Replace only the Ingress host (a strategic merge would drop the path rules).
  - target:
      kind: Ingress
      name: reef
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: reef.ietf.org

images:
  - name: ghcr.io/ietf-tools/reef-backend
    newTag: production
  - name: ghcr.io/ietf-tools/reef-frontend
    newTag: production
  - name: ghcr.io/ietf-tools/reef-statics
    newTag: production
